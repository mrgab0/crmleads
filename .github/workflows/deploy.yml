name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Typecheck in Cloud Runner
        run: |
          echo "Installing dependencies for static type validation..."
          npm install --no-audit
          echo "Running TypeScript compiler check..."
          npx tsc --noEmit

      - name: Trigger Vercel Production Deployment via API
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "Triggering Vercel deployment for crmleads..."
          RESPONSE=$(curl -s -X POST "https://api.vercel.com/v13/deployments?teamId=team_qg3qxgryuQ89HGdoGZOJrlWg" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "crmleads",
              "project": "prj_5cVcatp731kiwutA3U0RDbXbqqvP",
              "target": "production",
              "gitSource": {
                "type": "github",
                "repoId": 1447420052,
                "ref": "main"
              }
            }')

          echo "Response: $RESPONSE"
          DEPLOYMENT_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
          DEPLOYMENT_URL=$(echo "$RESPONSE" | jq -r '.url // empty')

          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "❌ Deployment trigger failed!"
            exit 1
          fi

          echo "============================================="
          echo "🚀 VERCEL DEPLOYMENT TRIGGERED SUCCESSFULLY!"
          echo "Deployment ID: $DEPLOYMENT_ID"
          echo "Deployment URL: https://$DEPLOYMENT_URL"
          echo "============================================="

          echo "Waiting for deployment $DEPLOYMENT_ID to finish building..."
          for i in {1..40}; do
            STATUS_RESP=$(curl -s "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID?teamId=team_qg3qxgryuQ89HGdoGZOJrlWg" \
              -H "Authorization: Bearer $VERCEL_TOKEN")
            READY_STATE=$(echo "$STATUS_RESP" | jq -r '.readyState // .status // empty')
            echo "Attempt $i: readyState = $READY_STATE"
            if [ "$READY_STATE" = "READY" ]; then
              echo "✅ Deployment is READY!"
              echo "Aliases:"
              echo "$STATUS_RESP" | jq -r '.alias[]? // empty'
              break
            elif [ "$READY_STATE" = "ERROR" ] || [ "$READY_STATE" = "CANCELED" ]; then
              echo "❌ Deployment failed with state: $READY_STATE"
              echo "=== VERCEL BUILD EVENTS LOG ==="
              curl -s "https://api.vercel.com/v2/deployments/$DEPLOYMENT_ID/events?teamId=team_qg3qxgryuQ89HGdoGZOJrlWg" \
                -H "Authorization: Bearer $VERCEL_TOKEN" | jq -r '.[]? | "\(.created // "") [\(.type // "")] \(.payload.text // .payload.info // "")"'
              echo "==============================="
              exit 1
            fi
            sleep 10
          done

          echo "Fetching Project Domains and Aliases..."
          PROJ_RESP=$(curl -s "https://api.vercel.com/v9/projects/prj_5cVcatp731kiwutA3U0RDbXbqqvP?teamId=team_qg3qxgryuQ89HGdoGZOJrlWg" \
            -H "Authorization: Bearer $VERCEL_TOKEN")
          echo "Project Targets / Aliases:"
          echo "$PROJ_RESP" | jq -r '.targets.production.alias[]? // empty'

